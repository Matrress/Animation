<div class="ddx"><div class="app">
  <header class="top">
    <div class="brand"></div>
    <div class="tools">
      <button class="tbtn" id="galbtn" type="button" data-sb="1" aria-pressed="false" aria-label="Select &amp; Buy: choose your size and height" title="Select &amp; Buy">{{bag}}<span>Select &amp; Buy</span></button>
      <button class="allbtn" id="allbtn" type="button" aria-pressed="false" aria-label="All topics: the whole list" title="All topics">{{list}}<span>All topics</span></button>
      <div class="seg" role="group" aria-label="View"><button type="button" data-view="tv" aria-pressed="true">Optimised Preview</button><button type="button" data-view="std" aria-pressed="false">Standard Product View</button></div>
    </div>
  </header>
  <main class="monitor"><div class="screen">
    <nav class="chbar" id="chbar" aria-label="Explore and Select &amp; Buy"></nav>
    <nav class="rail" id="rail" aria-label="This topic and your order"></nav>
    <section class="stage"><div class="colh" id="stageh"></div><div class="answer" id="answer"></div><div class="act" id="act"></div></section>
    <aside class="mine" id="mine" aria-label="Your selection"></aside>
  </div><div class="all" id="all" hidden role="dialog" aria-modal="true" aria-label="All topics"></div></main>
</div><div class="toast" id="toast" role="status"></div></div>
