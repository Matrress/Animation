<div class="ddx"><div class="app">
  <header class="top">
    <div class="brand"></div>
    <div class="tools">
      <button class="tbtn" id="galbtn" type="button" data-sb="1" aria-pressed="false" aria-label="Select &amp; Buy: choose your size and depth" title="Select &amp; Buy">{{bag}}<span>Select &amp; Buy</span></button>
      <div class="seg" role="group" aria-label="View"><button type="button" data-view="tv" aria-pressed="true">Optimised Preview</button><button type="button" data-view="std" aria-pressed="false">Standard Product View</button></div>
    </div>
  </header>
  <main class="monitor"><div class="screen">
    <nav class="chbar" id="chbar" aria-label="Explore and Select &amp; Buy"></nav>
    <nav class="rail" id="rail" aria-label="This topic and your order"></nav>
    <section class="stage"><div class="colh" id="stageh"></div><div class="answer" id="answer"></div><div class="act" id="act"></div></section>
    <aside class="mine" id="mine" aria-label="Your selection"></aside>
  </div><div class="all" id="all" hidden role="dialog" aria-modal="true" aria-label="All topics"></div><div class="gmodal" id="gmodal" hidden role="dialog" aria-modal="true" aria-label="Photographs of the mattress"><div class="gwrap"><button type="button" class="x gclose" aria-label="Close the photographs">{{close}}</button><div class="gstage"><button type="button" class="gnav gprev" aria-label="Previous photograph">{{prev}}</button><figure class="gfig"><img id="gimg" alt=""><figcaption id="gcap"></figcaption></figure><button type="button" class="gnav gnext" aria-label="Next photograph">{{next}}</button></div><div class="gthumbs"></div></div></div><div class="vmodal" id="vmodal" hidden role="dialog" aria-modal="true" aria-label="Film"><div class="vwrap"><button type="button" class="x vclose" aria-label="Close the film">{{close}}</button><video id="vfull" controls playsinline preload="none"></video></div></div></main>
</div><div class="toast" id="toast" role="status"></div></div>
