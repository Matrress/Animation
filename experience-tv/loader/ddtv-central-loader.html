<script>/* Divine Dunlop Dreams Experience loader v1.4: one loader for every model, a pointer names up to 4 files. Acts only on a product page that carries its own #ddtv-pointer for that product id, and loads only exact files from media.divinedunlop.com/ddtv/. ?ddtv=test: test opt-in. ?ddtv=off: nothing. v1.4: the television's place is kept by a style sheet from the first moment, before the shop has drawn the page (top row, description and the 100 px stay hidden, up to 30 s), so nothing jumps on a slow tablet. LIVE: the product ids that show the television to everyone. On any problem the shop page is given back as Ecwid made it. */
(function(w,d){var B='https://media.divinedunlop.com/ddtv/',LIVE=[876405767],NAME=/^[a-z][a-z0-9-]{0,45}-[0-9a-f]{20}\.js$/,MODEL=/^[a-z0-9-]{1,40}$/,q=w.location.search,seen={},seq=0,H,tm,mo,s=w.screen||{};

function ph(){var p=Math.min(s.width||9999,s.height||9999)<600;if(/[?&]ddtv=tv\b/.test(q))p=false;if(/[?&]ddtv=phone\b/.test(q))p=true;return p}
function free(){clearTimeout(tm);if(mo)mo.disconnect();if(H)H.classList.add('ddtv-go')}
function hold(){if(!H)return;if(ph()||d.getElementById('ddtv-experience')){free();return}H.classList.remove('ddtv-go');clearTimeout(tm);tm=setTimeout(free,30000);if(mo)mo.disconnect();mo=new MutationObserver(function(){if(d.getElementById('ddtv-experience'))free()});mo.observe(H,{childList:true,subtree:true})}
function sel(x){return LIVE.map(function(i){return'html:not(.ddtv-go):has(.ecwid-productBrowser-ProductPage-'+i+') '+x}).join()}
var st=d.createElement('style');st.id='ddtv-early';st.textContent=sel(':is(.product-details__top,.product-details__product-title)')+'{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip-path:inset(50%)!important;opacity:0!important}'+sel('#tile-product-details .ins-tile__wrap')+'{margin-top:14px!important}'+sel('.product-details')+'{visibility:hidden;max-height:min(120vh,1250px);overflow:hidden}'+sel('.product-details::before')+'{content:"";display:block;visibility:visible;min-height:min(100vh,1100px);border-radius:14px;background:#f7f7ee}';(function ini(){if(!d.documentElement)return setTimeout(ini,5);H=d.documentElement;(d.head||H).appendChild(st);hold()})();
function testOn(){try{return w.sessionStorage.getItem('ddtvTest')==='1'}catch(e){return false}}
try{if(/[?&]ddtv=test\b/.test(q))w.sessionStorage.setItem('ddtvTest','1')}catch(e){}
function pg(){var n=d.querySelector('[class*="ecwid-productBrowser-ProductPage-"]'),m=n&&/ProductPage-(\d+)/.exec(n.className);return m?{n:n,id:+m[1]}:null}
function use(e,id){var a=function(k){return e.getAttribute('data-ddtv-'+k)||''},c=a('channel'),L,i,bad=function(){H.setAttribute('data-ddtv-load','failed');free()};
if(a('v')!=='1'||a('product')!==String(id)||!MODEL.test(a('model')))return free();
if(!(c==='test'&&testOn())&&!((c==='live'||c==='test')&&LIVE.indexOf(id)>=0))return free();
L=(ph()?a('phone'):a('tv')).split(' ');if(L.length>4)return free();for(i=0;i<L.length;i++)if(!NAME.test(L[i]))return free();
w.__ddtvPage={type:'PRODUCT',productId:id};w.__ddtvAllow=w.__ddtvAllow||[];if(w.__ddtvAllow.indexOf(id)<0)w.__ddtvAllow.push(id);
for(i=0;i<L.length;i++)if(!seen[L[i]]){seen[L[i]]=1;var e2=d.createElement('script');e2.async=false;e2.src=B+L[i];e2.onerror=bad;d.head.appendChild(e2)}}
function go(id){var me=++seq,n=0;(function t(){if(me!==seq)return;var p=pg(),e=p&&p.id===id&&p.n.querySelector('#ddtv-pointer');if(e)return use(e,id);if(++n<170&&(!p||p.id===id))setTimeout(t,150);else free()})()}
function safe(id){try{if(LIVE.indexOf(+id)>=0)hold();go(+id)}catch(e){free()}}
(function wait(n){if(w.Ecwid&&w.Ecwid.OnPageLoaded){w.Ecwid.OnPageLoaded.add(function(g){if(g&&g.type==='PRODUCT')safe(g.productId);else free()});var p=pg();if(p)safe(p.id);return}if(n<300)setTimeout(function(){wait(n+1)},100);else free()})(0)})(window,document);
</script>
