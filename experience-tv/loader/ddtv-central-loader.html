<script>/* Divine Dunlop Dreams Experience loader v1.3: one loader for every model; a pointer may name up to 4 files, loaded in order (shared engine + model package). Acts only on a product page that carries its own #ddtv-pointer for that product id, and loads only exact files from media.divinedunlop.com/ddtv/. ?ddtv=test: the owner's test opt-in. ?ddtv=off: nothing. While the television loads its place is kept (at most 25 s, slow tablets) and the shop's own top row (path, title, 100 px) stays hidden, so nothing shows and nothing jumps; LIVE lists the product ids that show the television to everyone. On any problem the shop page stays as Ecwid made it. */
(function(w,d){var B='https://media.divinedunlop.com/ddtv/',LIVE=[876405767],NAME=/^[a-z][a-z0-9-]{0,45}-[0-9a-f]{20}\.js$/,MODEL=/^[a-z0-9-]{1,40}$/,q=w.location.search,seen={},seq=0,rel=null;
if(/[?&]ddtv=off\b/.test(q)||w.__ddtvLoader)return;w.__ddtvLoader=1;
function testOn(){try{return w.sessionStorage.getItem('ddtvTest')==='1'}catch(e){return false}}
try{if(/[?&]ddtv=test\b/.test(q))w.sessionStorage.setItem('ddtvTest','1')}catch(e){}
function pg(){var n=d.querySelector('[class*="ecwid-productBrowser-ProductPage-"]'),m=n&&/ProductPage-(\d+)/.exec(n.className);return m?{n:n,id:+m[1]}:null}
function hold(pd){if(!pd||!pd.parentNode||d.getElementById('ddtv-reserve'))return;var s=d.getElementById('ddtv-hold-css'),r=d.createElement('div'),mo,t,end=function(){if(mo)mo.disconnect();clearTimeout(t);if(r.parentNode)r.parentNode.removeChild(r);if(rel===end)rel=null};
if(!s){s=d.createElement('style');s.id='ddtv-hold-css';s.textContent='#ddtv-reserve{min-height:min(120vh,1250px);margin:0 0 24px;border-radius:14px;background:#f7f7ee}#ddtv-reserve+.product-details{visibility:hidden}html:has(#ddtv-reserve) :is(.product-details__top,.product-details__product-title){position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip-path:inset(50%)!important;opacity:0!important}html:has(#ddtv-reserve) #tile-product-details .ins-tile__wrap{margin-top:14px!important}';d.head.appendChild(s)}
r.id='ddtv-reserve';r.setAttribute('aria-hidden','true');pd.parentNode.insertBefore(r,pd);rel=end;
mo=new MutationObserver(function(){if(d.getElementById('ddtv-experience'))end()});mo.observe(d.body,{childList:true,subtree:true});t=setTimeout(end,25000)}
function use(e,id){var a=function(k){return e.getAttribute('data-ddtv-'+k)||''},c=a('channel'),s=w.screen||{},ph=Math.min(s.width||9999,s.height||9999)<600,L,i,fresh=false,pd=e.closest&&e.closest('.product-details'),bad=function(){d.documentElement.setAttribute('data-ddtv-load','failed');if(rel)rel()};
if(/[?&]ddtv=tv\b/.test(q))ph=false;if(/[?&]ddtv=phone\b/.test(q))ph=true;
if(a('v')!=='1'||a('product')!==String(id)||!MODEL.test(a('model')))return;
if(!(c==='test'&&testOn())&&!((c==='live'||c==='test')&&LIVE.indexOf(id)>=0))return;
L=(ph?a('phone'):a('tv')).split(' ');if(L.length>4)return;for(i=0;i<L.length;i++)if(!NAME.test(L[i]))return;
w.__ddtvPage={type:'PRODUCT',productId:id};w.__ddtvAllow=w.__ddtvAllow||[];if(w.__ddtvAllow.indexOf(id)<0)w.__ddtvAllow.push(id);
for(i=0;i<L.length;i++)if(!seen[L[i]]){seen[L[i]]=1;fresh=true;var e2=d.createElement('script');e2.async=false;e2.src=B+L[i];e2.onerror=bad;d.head.appendChild(e2)}
if(fresh&&!ph)hold(pd)}
function go(id){var me=++seq,n=0;(function t(){if(me!==seq)return;var p=pg(),e=p&&p.id===id&&p.n.querySelector('#ddtv-pointer');if(e)return use(e,id);if(++n<40&&(!p||p.id===id))setTimeout(t,150)})()}
function safe(id){try{go(+id)}catch(e){}}
(function wait(n){if(w.Ecwid&&w.Ecwid.OnPageLoaded){w.Ecwid.OnPageLoaded.add(function(g){if(g&&g.type==='PRODUCT')safe(g.productId)});var p=pg();if(p)safe(p.id);return}if(n<300)setTimeout(function(){wait(n+1)},100)})(0)})(window,document);
</script>
