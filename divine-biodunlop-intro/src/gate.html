<!-- BioDunlop intro gate (must stay BEFORE <section class="ddh">). One switch: set ON=0 to switch it all off everywhere.
     data-ddb-ok = a laptop / monitor / tablet window (the sourcing video may show), data-ddb-anim = body movements allowed (no reduced motion, no Data Saver, no 2G/3G),
     data-ddb=pending = the opening turn plays (once per session). Testing: add ?ddb=1 to the page address to play the opening again; ?ddb=0 turns it all off. -->
<script>(function(){var ON=1,H=document.documentElement;try{var q=location.search,m=function(x){return matchMedia(x).matches},c=navigator.connection||{},f=/[?&]ddb=1(&|$)/.test(q);if(ON&&!/[?&]ddb=0(&|$)/.test(q)&&m('(min-width:701px) and (min-height:501px)')){H.setAttribute('data-ddb-ok','');if(!m('(prefers-reduced-motion: reduce)')&&(f||!c.saveData&&!/(^|-)2g|3g/.test(c.effectiveType||''))){H.setAttribute('data-ddb-anim','');if(f||!sessionStorage.getItem('ddb-seen')){H.setAttribute('data-ddb','pending');setTimeout(function(){if(H.getAttribute('data-ddb')==='pending')H.removeAttribute('data-ddb')},4500)}}}}catch(e){}})()</script>
