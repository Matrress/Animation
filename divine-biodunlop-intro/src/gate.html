<!-- BioDunlop intro gate (must stay BEFORE <section class="ddh">). One switch: set ON=0 to switch the intro off everywhere.
     Testing: add ?ddb=1 to the page address to play it again (ignores "already seen" and the connection checks); ?ddb=0 turns it off. -->
<script>(function(){var ON=1,H=document.documentElement;try{var q=location.search,m=function(x){return matchMedia(x).matches},c=navigator.connection||{};if(ON&&!/[?&]ddb=0(&|$)/.test(q)&&m('(min-width:701px) and (min-height:501px)')&&!m('(prefers-reduced-motion: reduce)')&&(/[?&]ddb=1(&|$)/.test(q)||!c.saveData&&!/(^|-)2g|3g/.test(c.effectiveType||'')&&!sessionStorage.getItem('ddb-seen'))){H.setAttribute('data-ddb','pending');setTimeout(function(){if(H.getAttribute('data-ddb')==='pending')H.removeAttribute('data-ddb')},4500)}}catch(e){}})()</script>
